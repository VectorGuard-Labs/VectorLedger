[package]
name        = "vledger-kani"
description = "Kani formal verification proof harnesses for VectorLedger"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true

[lib]
name = "vledger_kani"
path = "src/lib.rs"

[dependencies]
vledger-crypto      = { workspace = true }
vledger-wal         = { workspace = true }
vledger-ledger      = { workspace = true }
vledger-replication = { workspace = true }

# `cfg(kani)` is set by the Kani verifier, not by cargo.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
